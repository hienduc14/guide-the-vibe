<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gtv · Realworld API (prototype)</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // apply a saved theme before first paint; no saved choice = follow the system
      try { const t = localStorage.getItem("gtv.proto.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <nav class="rail" id="rail" aria-label="Ứng dụng"></nav>
      <div class="main">
        <header class="top" id="top"></header>
        <main class="screen" id="screen"></main>
      </div>
    </div>
    <dialog class="sheet" id="sheet" aria-label="Chi tiết file"></dialog>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
