# Development stack: the Operator server; its brain (Pi) runs inside it and calls the model over HTTPS.
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
services:
  operator:
    build: { context: .., dockerfile: docker/Dockerfile }
    ports: ["7390:7390"]
    environment:
      # Optional: bootstrap a project "default" from one repo; otherwise create projects in the dashboard.
      GTV_REPO_URL: ${GTV_REPO_URL:-}
      GTV_MAIN_BRANCH: ${GTV_MAIN_BRANCH:-main}
      # Port 7390 is published: without it the dashboard API is open to anyone who can reach the port.
      GTV_ADMIN_TOKEN: ${GTV_ADMIN_TOKEN:?set GTV_ADMIN_TOKEN in docker/.env}
      GTV_TOKENS: ${GTV_TOKENS:-}
      GTV_POLL_MS: ${GTV_POLL_MS:-15000}
      GTV_CONFIG: /config/gtv.config.yml
      # Brain: providers and model are set on the dashboard (Brain page); env vars below are optional defaults.
      # Keys entered on the dashboard are encrypted with GTV_SECRET_KEY.
      GTV_SECRET_KEY: ${GTV_SECRET_KEY:?set GTV_SECRET_KEY in docker/.env}
      BRAIN_BACKEND: ${BRAIN_BACKEND:-pi}
      BRAIN_MODEL: ${BRAIN_MODEL:-}
      BRAIN_BASE_URL: ${BRAIN_BASE_URL:-}
      BRAIN_API_KEY: ${BRAIN_API_KEY:-}
      BRAIN_API: ${BRAIN_API:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - gtv-data:/data
      - ./gtv.config.yml:/config/gtv.config.yml:ro
      # Local bare repos for development (GTV_REPO_URL=/repos/<name>.git)
      - ${GTV_LOCAL_REPOS:-../sandbox}:/repos
    restart: unless-stopped
volumes:
  gtv-data: {}
