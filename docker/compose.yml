# Development stack: Operator server + OpenCode brain.
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
services:
  operator:
    build: { context: .., dockerfile: docker/Dockerfile }
    ports: ["7390:7390"]
    environment:
      # Optional: bootstrap a project "default" from one repo; otherwise create projects in the dashboard.
      GTV_REPO_URL: ${GTV_REPO_URL:-}
      GTV_MAIN_BRANCH: ${GTV_MAIN_BRANCH:-main}
      GTV_ADMIN_TOKEN: ${GTV_ADMIN_TOKEN:-}
      GTV_INTERNAL_URL: http://operator:7390
      GTV_TOKENS: ${GTV_TOKENS:-}
      GTV_POLL_MS: ${GTV_POLL_MS:-15000}
      GTV_CONFIG: /config/gtv.config.yml
      GTV_BRAIN_TOKEN: ${GTV_BRAIN_TOKEN:-}
      BRAIN_BACKEND: ${BRAIN_BACKEND:-opencode}
      BRAIN_MODEL: ${BRAIN_MODEL:-}
      OPENCODE_URL: http://brain:4096
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    volumes:
      - gtv-data:/data
      - ./gtv.config.yml:/config/gtv.config.yml:ro
      # Local bare repos for development (GTV_REPO_URL=/repos/<name>.git)
      - ${GTV_LOCAL_REPOS:-../sandbox}:/repos
    restart: unless-stopped
  brain:
    build: { context: .., dockerfile: docker/Dockerfile.brain }
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      GTV_BRAIN_TOKEN: ${GTV_BRAIN_TOKEN:-}
    volumes:
      - opencode-data:/root/.local/share/opencode
    ports: ["127.0.0.1:4096:4096"]
    restart: unless-stopped
volumes:
  gtv-data: {}
  opencode-data: {}
