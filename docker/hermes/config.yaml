# Hermes Agent config for the gtv Operator brain. Seeded into the brain volume ($HERMES_HOME=/opt/data)
# on first boot only; after editing, delete /opt/data/config.yaml in the volume and restart (docs/operations.md).

_config_version: 50 # Hermes config schema (v0.22); without it Hermes treats this file as too old to migrate

# Default model when gtv sends none (gtv sends provider/model from BRAIN_MODEL or the dashboard).
# Any Hermes provider works, e.g. a ChatGPT plan (log in: hermes auth add openai-codex --no-browser) or any
# OpenAI-compatible endpoint (CLIProxyAPI, vLLM, LiteLLM…):
#   model: { provider: custom, default: <model>, base_url: http://host:port/v1, api_key: "${LLM_API_KEY}" }
model:
  provider: openai-codex
  default: gpt-6-luna

# Read-only brain: the api_server platform gets only the gtv MCP tools (mcp__gtv__*), nothing that can
# write files, run code, browse or delegate. disabled_toolsets runs last and wins over everything.
platform_toolsets:
  api_server: [gtv]
agent:
  disabled_toolsets:
    [
      terminal,
      file,
      code_execution,
      delegation,
      browser,
      web,
      search,
      x_search,
      memory,
      skills,
      cronjob,
      image_gen,
      video_gen,
      vision,
      video,
      tts,
      todo,
      session_search,
      computer_use,
      connections,
      kanban,
    ]
  max_turns: 30 # Hermes has no per-request timeout; gtv also aborts after BRAIN_TIMEOUT_MS

gateway:
  api_server:
    max_concurrent_runs: 4

mcp_servers:
  gtv:
    url: "http://operator:7390/mcp"
    headers:
      Authorization: "Bearer ${GTV_BRAIN_TOKEN}"
    timeout: 60
    connect_timeout: 30
    tools:
      resources: false
      prompts: false
    sampling:
      enabled: false
